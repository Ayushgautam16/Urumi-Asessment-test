apiVersion: batch/v1
kind: Job
metadata:
  name: store-bootstrap-job
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app: store-bootstrap
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: store-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wp-cli
          image: wordpress:cli-php8.2
          envFrom:
            - secretRef:
                name: store-secret
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for WooCommerce store web service..."
              until nc -z -v -w5 woocommerce-store.{{ .Release.Namespace }}.svc.cluster.local 80; do
                echo "Waiting for store service to accept connections..."
                sleep 5
              done

              echo "Checking WordPress installation status..."
              sleep 5

              if ! wp core is-installed --path=/var/www/html 2>/dev/null; then
                echo "Installing WordPress core..."
                wp core install \
                  --path=/var/www/html \
                  --url="http://{{ .Values.ingress.storeHost }}" \
                  --title="Urumi Demo Store" \
                  --admin_user="{{ .Values.secrets.wpAdminUser }}" \
                  --admin_password="{{ .Values.secrets.wpAdminPassword }}" \
                  --admin_email="{{ .Values.secrets.wpAdminEmail }}" \
                  --skip-email
              fi

              echo "Ensuring WooCommerce plugin is active..."
              wp plugin install woocommerce --activate --path=/var/www/html || true

              echo "Enabling Cash on Delivery (COD) payment gateway..."
              wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery","description":"Pay with cash upon delivery.","instructions":"Pay with cash upon delivery.","enable_for_methods":[],"enable_for_virtual":"yes"}' --format=json --path=/var/www/html || true

              echo "Running WooCommerce installation and seeding products..."
              wp eval '
                if (class_exists("WC_Install")) {
                  WC_Install::install();
                }

                if (!function_exists("wc_api_hash")) {
                  function wc_api_hash($key) {
                    return hash_hmac("sha256", $key, "wc-api");
                  }
                }

                global $wpdb;
                $user_id = 1;
                $key_hash = wc_api_hash("{{ .Values.secrets.wcConsumerKey }}");
                $key_id = $wpdb->get_var($wpdb->prepare("SELECT key_id FROM {$wpdb->prefix}woocommerce_api_keys WHERE consumer_key = %s", $key_hash));
                if (!$key_id) {
                  $wpdb->insert(
                    "{$wpdb->prefix}woocommerce_api_keys",
                    array(
                      "user_id"         => $user_id,
                      "description"     => "Team MCP Gateway REST Key",
                      "permissions"     => "read_write",
                      "consumer_key"    => $key_hash,
                      "consumer_secret" => "{{ .Values.secrets.wcConsumerSecret }}",
                      "truncated_key"   => substr("{{ .Values.secrets.wcConsumerKey }}", -7),
                      "last_access"     => null
                    ),
                    array("%d", "%s", "%s", "%s", "%s", "%s", "%s")
                  );
                  echo "WooCommerce API key created.\n";
                } else {
                  echo "WooCommerce API key already exists.\n";
                }

                // Check if products exist
                $prods = get_posts(array("post_type" => "product", "numberposts" => 1));
                if (empty($prods) && class_exists("WC_Product_Simple")) {
                  $p1 = new WC_Product_Simple();
                  $p1->set_name("Ergonomic Mechanical Keyboard");
                  $p1->set_regular_price("149.00");
                  $p1->set_manage_stock(true);
                  $p1->set_stock_quantity(50);
                  $p1->set_status("publish");
                  $p1->save();

                  $p2 = new WC_Product_Simple();
                  $p2->set_name("Wireless Precision Mouse");
                  $p2->set_regular_price("69.00");
                  $p2->set_manage_stock(true);
                  $p2->set_stock_quantity(35);
                  $p2->set_status("publish");
                  $p2->save();
                  echo "Demo products seeded successfully.\n";
                }
              ' --path=/var/www/html

              echo "Store bootstrap complete!"
          volumeMounts:
            - name: store-data
              mountPath: /var/www/html
      volumes:
        - name: store-data
          persistentVolumeClaim:
            claimName: store-pvc
