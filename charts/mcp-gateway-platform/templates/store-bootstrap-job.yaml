apiVersion: batch/v1
kind: Job
metadata:
  name: store-bootstrap-job
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app: store-bootstrap
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: store-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wp-cli
          image: wordpress:cli-php8.2
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for WooCommerce store web service..."
              until nc -z -v -w5 woocommerce-store.{{ .Release.Namespace }}.svc.cluster.local 80; do
                echo "Waiting for store service to accept connections..."
                sleep 5
              done

              echo "Checking WordPress installation status..."
              # Wait for core files to exist in shared volume or initialize
              sleep 10

              # Check if core is installed
              if ! wp core is-installed --path=/var/www/html 2>/dev/null; then
                echo "Installing WordPress core..."
                wp core install \
                  --path=/var/www/html \
                  --url="http://{{ .Values.ingress.storeHost }}" \
                  --title="Urumi Demo Store" \
                  --admin_user="{{ .Values.secrets.wpAdminUser }}" \
                  --admin_password="{{ .Values.secrets.wpAdminPassword }}" \
                  --admin_email="{{ .Values.secrets.wpAdminEmail }}" \
                  --skip-email
              fi

              # Install and activate WooCommerce
              echo "Ensuring WooCommerce plugin is active..."
              wp plugin install woocommerce --activate --path=/var/www/html || true

              # Enable Cash on Delivery (COD) for testing checkout without credit cards
              echo "Enabling Cash on Delivery (COD) payment gateway..."
              wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery","description":"Pay with cash upon delivery.","instructions":"Pay with cash upon delivery.","enable_for_methods":[],"enable_for_virtual":"yes"}' --format=json --path=/var/www/html || true

              # Seed demo products if empty
              echo "Checking catalog products..."
              COUNT=$(wp post list --post_type=product --format=count --path=/var/www/html 2>/dev/null || echo 0)
              if [ "$COUNT" -eq "0" ]; then
                echo "Seeding initial products for testing..."
                wp wc product create \
                  --name="Ergonomic Mechanical Keyboard" \
                  --type=simple \
                  --regular_price="149.00" \
                  --description="High-performance mechanical keyboard with tactile switches." \
                  --short_description="Tactile mechanical switches with RGB backlight." \
                  --manage_stock=true \
                  --stock_quantity=50 \
                  --status=publish \
                  --user=1 \
                  --path=/var/www/html || true

                wp wc product create \
                  --name="Wireless Precision Mouse" \
                  --type=simple \
                  --regular_price="69.00" \
                  --description="Ultra-lightweight wireless gaming and productivity mouse." \
                  --manage_stock=true \
                  --stock_quantity=35 \
                  --status=publish \
                  --user=1 \
                  --path=/var/www/html || true
              fi

              # Configure REST API keys in database
              echo "Provisioning WooCommerce REST API keys for MCP server..."
              wp eval '
                global $wpdb;
                $user_id = 1;
                $key_id = $wpdb->get_var($wpdb->prepare("SELECT key_id FROM {$wpdb->prefix}woocommerce_api_keys WHERE consumer_key = %s", wc_api_hash("{{ .Values.secrets.wcConsumerKey }}")));
                if (!$key_id) {
                  $wpdb->insert(
                    "{$wpdb->prefix}woocommerce_api_keys",
                    array(
                      "user_id"         => $user_id,
                      "description"     => "Team MCP Gateway REST Key",
                      "permissions"     => "read_write",
                      "consumer_key"    => wc_api_hash("{{ .Values.secrets.wcConsumerKey }}"),
                      "consumer_secret" => "{{ .Values.secrets.wcConsumerSecret }}",
                      "truncated_key"   => substr("{{ .Values.secrets.wcConsumerKey }}", -7),
                      "last_access"     => null
                    ),
                    array("%d", "%s", "%s", "%s", "%s", "%s", "%s")
                  );
                  echo "WooCommerce API key created.\n";
                } else {
                  echo "WooCommerce API key already exists.\n";
                }
              ' --path=/var/www/html || true

              echo "Store bootstrap complete!"
          volumeMounts:
            - name: store-data
              mountPath: /var/www/html
      volumes:
        - name: store-data
          persistentVolumeClaim:
            claimName: store-pvc
