apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app: woocommerce-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woocommerce-mcp
  template:
    metadata:
      labels:
        app: woocommerce-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mcp-server
          image: "{{ .Values.woocommerceMcp.image.repository }}:{{ .Values.woocommerceMcp.image.tag }}"
          imagePullPolicy: {{ .Values.woocommerceMcp.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.woocommerceMcp.service.port }}
              name: mcp-http
          env:
            - name: PORT
              value: "{{ .Values.woocommerceMcp.service.port }}"
            - name: WC_URL
              value: "http://woocommerce-store.{{ .Release.Namespace }}.svc.cluster.local"
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woocommerce-mcp-secret
                  key: WC_CONSUMER_KEY
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woocommerce-mcp-secret
                  key: WC_CONSUMER_SECRET
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.woocommerceMcp.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.woocommerceMcp.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: woocommerce-mcp
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app: woocommerce-mcp
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.woocommerceMcp.service.port }}
      targetPort: {{ .Values.woocommerceMcp.service.port }}
      name: http
  selector:
    app: woocommerce-mcp
