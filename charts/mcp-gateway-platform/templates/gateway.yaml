apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-pvc
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app: gateway
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.gateway.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.service.port }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.gateway.service.port }}"
            - name: DATA_DIR
              value: "/data"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: GEMINI_API_KEY
            - name: GEMINI_MODEL
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: GEMINI_MODEL
            - name: WC_MCP_URL
              value: "http://woocommerce-mcp.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.woocommerceMcp.service.port }}/sse"
            - name: CURRENCY_MCP_URL
              value: "http://upstream-currency.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.upstreamCurrency.service.port }}/sse"
            - name: INVENTORY_MCP_URL
              value: "http://upstream-inventory.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.upstreamInventory.service.port }}/sse"
          volumeMounts:
            - name: gateway-data
              mountPath: /data
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: gateway-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app: gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.port }}
      name: http
  selector:
    app: gateway
