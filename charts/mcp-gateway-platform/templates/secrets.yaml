apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  mariadb-root-password: {{ .Values.secrets.mysqlRootPassword | quote }}
  mariadb-database: {{ .Values.secrets.mysqlDatabase | quote }}
  mariadb-user: {{ .Values.secrets.mysqlUser | quote }}
  mariadb-password: {{ .Values.secrets.mysqlPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-secret
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  WORDPRESS_DB_HOST: "mariadb.{{ .Release.Namespace }}.svc.cluster.local:3306"
  WORDPRESS_DB_NAME: {{ .Values.secrets.mysqlDatabase | quote }}
  WORDPRESS_DB_USER: {{ .Values.secrets.mysqlUser | quote }}
  WORDPRESS_DB_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  WORDPRESS_ADMIN_USER: {{ .Values.secrets.wpAdminUser | quote }}
  WORDPRESS_ADMIN_PASSWORD: {{ .Values.secrets.wpAdminPassword | quote }}
  WORDPRESS_ADMIN_EMAIL: {{ .Values.secrets.wpAdminEmail | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woocommerce-mcp-secret
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  WC_CONSUMER_KEY: {{ .Values.secrets.wcConsumerKey | quote }}
  WC_CONSUMER_SECRET: {{ .Values.secrets.wcConsumerSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  GEMINI_MODEL: {{ .Values.secrets.geminiModel | quote }}
