server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to internal gateway service
    location /api/ {
        proxy_pass http://gateway.mcp-system.svc.cluster.local:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy MCP SSE & messages to internal gateway service
    location /mcp/ {
        proxy_pass http://gateway.mcp-system.svc.cluster.local:4000/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
    }

    # Health check endpoint
    location /health {
        return 200 '{"status":"healthy","service":"dashboard"}';
        add_header Content-Type application/json;
    }
}
